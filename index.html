<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sen uchun ❤️ - Josiya</title>
  
  <!-- Shriftlar -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- Three.js va Tween.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at center, #120224 0%, #06010d 55%, #020005 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      position: fixed;
      touch-action: none;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 2;
      display: block;
    }

    /* Minimalist va Nafis UI */
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px));
      padding-left: 20px;
      padding-right: 20px;
    }

    .btn-wrapper {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      width: auto;
    }

    .btn-wrapper.hidden {
      opacity: 0;
      transform: translateY(40px) scale(0.9);
      pointer-events: none;
    }

    /* Professional Neon "BOSING" Tugmasi */
    .neon-btn {
      position: relative;
      min-width: 260px;
      min-height: 58px;
      background: linear-gradient(135deg, rgba(255, 0, 75, 0.45) 0%, rgba(140, 20, 220, 0.55) 100%);
      border: 1.5px solid rgba(255, 130, 180, 0.85);
      color: #ffffff;
      padding: 16px 42px;
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      border-radius: 60px;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 40px rgba(255, 0, 80, 0.5),
                  0 0 80px rgba(140, 20, 220, 0.35),
                  inset 0 0 20px rgba(255, 255, 255, 0.35);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      animation: btnGlowPulse 2.4s infinite ease-in-out;
    }

    @keyframes btnGlowPulse {
      0%, 100% {
        box-shadow: 0 0 35px rgba(255, 0, 80, 0.5),
                    0 0 70px rgba(140, 20, 220, 0.3),
                    inset 0 0 15px rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 110, 160, 0.75);
      }
      50% {
        box-shadow: 0 0 55px rgba(255, 0, 80, 0.85),
                    0 0 100px rgba(150, 30, 240, 0.55),
                    inset 0 0 25px rgba(255, 255, 255, 0.5);
        border-color: rgba(255, 200, 230, 1);
        transform: translateY(-2px);
      }
    }

    .neon-btn:hover {
      background: linear-gradient(135deg, rgba(255, 20, 90, 0.7) 0%, rgba(160, 40, 245, 0.75) 100%);
      transform: scale(1.05) translateY(-3px);
    }

    .neon-btn:active {
      transform: scale(0.96) translateY(0);
      background: linear-gradient(135deg, rgba(255, 0, 75, 0.8) 0%, rgba(140, 20, 220, 0.85) 100%);
    }

    .btn-heart-icon {
      width: 22px;
      height: 22px;
      fill: #ff1744;
      filter: drop-shadow(0 0 8px #ff1744);
      animation: heartBeat 1.4s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* Ovoz tugmasi */
    .mute-btn {
      position: fixed;
      top: calc(20px + env(safe-area-inset-top, 0px));
      right: calc(20px + env(safe-area-inset-right, 0px));
      z-index: 25;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.3s;
      outline: none;
    }

    .mute-btn:hover {
      background: rgba(255, 30, 90, 0.35);
      border-color: rgba(255, 120, 170, 0.8);
      transform: scale(1.08);
      color: #fff;
    }

    .mute-btn:active {
      transform: scale(0.92);
    }

    /* Qayta ko'rish tugmasi */
    .replay-wrap {
      position: fixed;
      bottom: calc(26px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .replay-wrap.active {
      opacity: 0.9;
      pointer-events: auto;
    }

    .replay-btn {
      background: rgba(20, 10, 30, 0.7);
      border: 1.2px solid rgba(255, 90, 150, 0.6);
      color: rgba(255, 225, 240, 0.95);
      padding: 12px 28px;
      border-radius: 35px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(255, 20, 80, 0.4);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .replay-btn:hover {
      background: rgba(255, 20, 90, 0.45);
      border-color: rgba(255, 150, 200, 0.9);
      box-shadow: 0 0 35px rgba(255, 20, 90, 0.6);
      transform: scale(1.05);
    }

    .replay-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="ui-overlay">
    <div class="btn-wrapper" id="action-wrapper">
      <button class="neon-btn" id="open-btn">
        <svg class="btn-heart-icon" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        BOSING
      </button>
    </div>
  </div>

  <button class="mute-btn" id="mute-btn" title="Ovozni yoqish/o'chirish">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </button>

  <div class="replay-wrap" id="replay-box">
    <button class="replay-btn" id="replay-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
      Qayta ko'rish
    </button>
  </div>

  <audio id="bg-audio" loop preload="auto"></audio>

  <!-- ======================================================== -->
  <!-- 3D PARTICLES ENGINE                                      -->
  <!-- ======================================================== -->
  <script>
    const CONFIG = {
      recipientName: "Josiya",
      specialDate: "03.04.2026",
      particleCount: 35000, // 35,000 ta boy va qalin zarrachalar
      starCount: 2800,
      audioUrl: ""
    };

    function isMobile() {
      return (window.innerWidth < 768) || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    }

    /**
     * THREE.JS SAHNA VA RESPONSIVE KAMERA
     */
    const canvas = document.getElementById("webgl-canvas");
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04000a, 0.00065);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 4500);

    function updateCameraFrame() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / h;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      if (aspect < 0.6) {
        camera.position.z = 740;
      } else if (aspect < 0.8) {
        camera.position.z = 640;
      } else if (aspect < 1.1) {
        camera.position.z = 560;
      } else {
        camera.position.z = 480;
      }
    }
    updateCameraFrame();

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);

    /**
     * SICHQONCHA, TOUCH VA GYRO-TILT
     */
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    window.addEventListener("mousemove", (e) => {
      mouse.targetX = (e.clientX - window.innerWidth / 2) * 0.35;
      mouse.targetY = (e.clientY - window.innerHeight / 2) * 0.35;
    });

    window.addEventListener("touchstart", (e) => {
      initAudio();
      if (e.touches.length > 0) {
        mouse.targetX = (e.touches[0].clientX - window.innerWidth / 2) * 0.45;
        mouse.targetY = (e.touches[0].clientY - window.innerHeight / 2) * 0.45;
      }
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        mouse.targetX = (e.touches[0].clientX - window.innerWidth / 2) * 0.45;
        mouse.targetY = (e.touches[0].clientY - window.innerHeight / 2) * 0.45;
      }
    }, { passive: true });

    window.addEventListener("touchend", () => {
      mouse.targetX *= 0.3;
      mouse.targetY *= 0.3;
    }, { passive: true });

    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", (e) => {
        if (e.gamma !== null && e.beta !== null) {
          const tiltX = Math.max(-30, Math.min(30, e.gamma));
          const tiltY = Math.max(-30, Math.min(30, e.beta - 45));
          mouse.targetX = tiltX * 3.5;
          mouse.targetY = tiltY * 3.5;
        }
      }, { passive: true });
    }

    function onResize() {
      updateCameraFrame();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => setTimeout(onResize, 200));

    /**
     * YUQORI DARAJA PORLOQ ZARRACHA TEKSTURASI
     */
    function createGlowTexture() {
      const c = document.createElement("canvas");
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext("2d");

      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, "rgba(255, 255, 255, 1)");
      g.addColorStop(0.2, "rgba(255, 230, 245, 0.95)");
      g.addColorStop(0.5, "rgba(255, 30, 110, 0.45)");
      g.addColorStop(0.8, "rgba(140, 20, 220, 0.12)");
      g.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);

      const t = new THREE.CanvasTexture(c);
      t.needsUpdate = true;
      return t;
    }
    const glowTex = createGlowTexture();

    /**
     * MILTILLOVCHI YULDUZLAR FON QATLAMI
     */
    let starsPoints;
    function initStars() {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(CONFIG.starCount * 3);
      const col = new Float32Array(CONFIG.starCount * 3);

      for (let i = 0; i < CONFIG.starCount; i++) {
        const i3 = i * 3;
        pos[i3] = (Math.random() - 0.5) * 3000;
        pos[i3 + 1] = (Math.random() - 0.5) * 3000;
        pos[i3 + 2] = (Math.random() - 0.5) * 2600 - 450;

        const rand = Math.random();
        let c = (rand < 0.6) ? new THREE.Color(0xffffff) : (rand < 0.85 ? new THREE.Color(0xff75a8) : new THREE.Color(0xa855f7));
        col[i3] = c.r; col[i3 + 1] = c.g; col[i3 + 2] = c.b;
      }

      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: isMobile() ? 4.0 : 3.4,
        map: glowTex,
        transparent: true,
        opacity: 0.75,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      starsPoints = new THREE.Points(geo, mat);
      scene.add(starsPoints);
    }
    initStars();

    /**
     * ASOSIY ZARRACHALAR TIZIMI
     */
    const N = CONFIG.particleCount;
    const geometry = new THREE.BufferGeometry();

    const currentPos = new Float32Array(N * 3);
    const sourcePos = new Float32Array(N * 3);
    const targetPos = new Float32Array(N * 3);

    const currentCol = new Float32Array(N * 3);
    const sourceCol = new Float32Array(N * 3);
    const targetCol = new Float32Array(N * 3);

    const velocities = new Float32Array(N * 3);
    const delays = new Float32Array(N);

    // Vorteks uchun individual aylanish radiusi, burchagi va tezliklari
    const vortexRadii = new Float32Array(N);
    const vortexAngles = new Float32Array(N);
    const vortexSpeeds = new Float32Array(N);
    const vortexHeights = new Float32Array(N);

    for (let i = 0; i < N; i++) {
      delays[i] = Math.random() * 0.32;
    }

    geometry.setAttribute("position", new THREE.BufferAttribute(currentPos, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(currentCol, 3));

    const particlesMaterial = new THREE.PointsMaterial({
      size: isMobile() ? 5.2 : 4.6,
      map: glowTex,
      transparent: true,
      opacity: 0.95,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, particlesMaterial);
    scene.add(particleSystem);

    /**
     * ========================================================
     * 1-BOSQICH:
     * - "Sen uchun" YUQORISIDA mayda nuqtachalardan "03.04.2026"
     * - O'rtada "Sen uchun ❤️"
     * - Pastida Konvert va Yurakcha muhr
     * - Butun ekranga sochilgan sehrli kosmik zarrachalar
     * ========================================================
     */
    function createEnvelopeStage() {
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      let idx = 0;

      // 1. "03.04.2026" SANASI - "Sen uchun" matnining AYNAN YUQORISIDA!
      const datePoints = getCanvasPoints(CONFIG.specialDate, 44, 460, 80);
      const dateCount = 3600;
      const dateCenterY = 195;

      for (let i = 0; i < dateCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const p = datePoints[i % datePoints.length];
        pos[i3] = p.x + (Math.random() - 0.5) * 1.2;
        pos[i3 + 1] = p.y + dateCenterY + (Math.random() - 0.5) * 1.2;
        pos[i3 + 2] = (Math.random() - 0.5) * 4;

        const isCore = Math.random() < 0.65;
        if (isCore) {
          col[i3] = 1.0; col[i3 + 1] = 0.92; col[i3 + 2] = 0.95;
        } else {
          col[i3] = 1.0; col[i3 + 1] = 0.45; col[i3 + 2] = 0.75;
        }
      }

      // 2. "Sen uchun" matni (7,200 zarracha)
      const textPoints = getCanvasPoints("Sen uchun", 68, 440, 130);
      const textCount = 7200;
      for (let i = 0; i < textCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const p = textPoints[i % textPoints.length];
        pos[i3] = p.x - 48 + (Math.random() - 0.5) * 1.5;
        pos[i3 + 1] = p.y + 128 + (Math.random() - 0.5) * 1.5;
        pos[i3 + 2] = (Math.random() - 0.5) * 5;

        const isCore = Math.random() < 0.72;
        col[i3] = 1.0;
        col[i3 + 1] = isCore ? 0.95 : 0.45;
        col[i3 + 2] = isCore ? 0.98 : 0.75;
      }

      // 3. "Sen uchun" yozuvi yonidagi porloq Qizil Yurakcha Ikonkasi (❤️) (4,000 zarracha)
      const topHeartCount = 4000;
      for (let i = 0; i < topHeartCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const t = Math.random() * Math.PI * 2;
        const s = 1.55 * Math.sqrt(Math.random());

        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

        pos[i3] = hx * s + 145 + (Math.random() - 0.5) * 1.8;
        pos[i3 + 1] = hy * s + 128 + (Math.random() - 0.5) * 1.8;
        pos[i3 + 2] = (Math.random() - 0.5) * 12 + 6;

        col[i3] = 1.0;
        col[i3 + 1] = Math.random() < 0.2 ? 0.18 : 0.02;
        col[i3 + 2] = 0.2;
      }

      // 4. Konvert ramkasi va qopqog'i (5,600 zarracha)
      const envW = 290, envH = 185;
      const borderCount = 5600;
      for (let i = 0; i < borderCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const r = Math.random();
        let px = 0, py = 0;

        if (r < 0.25) { px = (Math.random() - 0.5) * envW; py = envH / 2; }
        else if (r < 0.5) { px = (Math.random() - 0.5) * envW; py = -envH / 2; }
        else if (r < 0.65) { px = -envW / 2; py = (Math.random() - 0.5) * envH; }
        else if (r < 0.8) { px = envW / 2; py = (Math.random() - 0.5) * envH; }
        else if (r < 0.9) {
          const t = Math.random();
          px = -envW / 2 * (1 - t); py = envH / 2 * (1 - t) - 12 * t;
        } else {
          const t = Math.random();
          px = envW / 2 * (1 - t); py = envH / 2 * (1 - t) - 12 * t;
        }

        pos[i3] = px + (Math.random() - 0.5) * 2;
        pos[i3 + 1] = py - 12 + (Math.random() - 0.5) * 2;
        pos[i3 + 2] = (Math.random() - 0.5) * 5;

        col[i3] = 0.98; col[i3 + 1] = 0.2; col[i3 + 2] = 0.68;
      }

      // 5. Konvert markazidagi 3D Qizil Yurakcha Muhr (6,000 zarracha)
      const sealCount = 6000;
      for (let i = 0; i < sealCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const t = Math.random() * Math.PI * 2;
        const s = 2.45 * Math.sqrt(Math.random());

        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

        pos[i3] = hx * s;
        pos[i3 + 1] = hy * s - 24;
        pos[i3 + 2] = (Math.random() - 0.5) * 16 + 14;

        col[i3] = 0.96; col[i3 + 1] = 0.04; col[i3 + 2] = 0.16;
      }

      // 6. BUTUN EKRAN BO'YLAB SOCHILGAN KOSMIK NUR VA YULDUZLAR (Qolgan 8,600+ zarracha)
      while (idx < N) {
        const i3 = idx * 3;
        const sub = Math.random();

        if (sub < 0.68) {
          pos[i3] = (Math.random() - 0.5) * 1400;
          pos[i3 + 1] = (Math.random() - 0.5) * 1100;
          pos[i3 + 2] = (Math.random() - 0.5) * 650;

          const cChoice = Math.random();
          if (cChoice < 0.45) {
            col[i3] = 0.95; col[i3 + 1] = 0.15; col[i3 + 2] = 0.55;
          } else if (cChoice < 0.75) {
            col[i3] = 0.65; col[i3 + 1] = 0.15; col[i3 + 2] = 0.95;
          } else if (cChoice < 0.9) {
            col[i3] = 1.0; col[i3 + 1] = 0.85; col[i3 + 2] = 0.9;
          } else {
            col[i3] = 0.05; col[i3 + 1] = 0.85; col[i3 + 2] = 0.8;
          }
        } else {
          const angle = Math.random() * Math.PI * 2;
          const radius = 170 + Math.random() * 380;
          pos[i3] = Math.cos(angle) * radius + (Math.random() - 0.5) * 50;
          pos[i3 + 1] = Math.sin(angle) * (radius * 0.7) + (Math.random() - 0.5) * 50;
          pos[i3 + 2] = (Math.random() - 0.5) * 180;

          col[i3] = 0.85; col[i3 + 1] = 0.18; col[i3 + 2] = 0.65;
        }

        idx++;
      }

      return { positions: pos, colors: col };
    }

    /**
     * ========================================================
     * 2-BOSQICH: HAQIQIY GIGANT 3D KOSMIK GALAKTIKA VORTEKSI
     * (Supermassive Galactic Core + Accretion Disk + Cosmic Jets)
     * ========================================================
     */
    function createVortexStage() {
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      let idx = 0;

      // 1. MARKAZIY O'TA YORQIN YADRO (Supermassive Core / Quasar Bulge) - 6,500 zarracha
      // Zich, qizigan oq-oltin va elektr ko'k plazma shari
      const coreCount = 6500;
      for (let i = 0; i < coreCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const u = Math.random();
        const r = Math.pow(u, 1.8) * 55; // Markazda o'ta zich
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * Math.PI * 0.7;

        const x = r * Math.cos(theta) * Math.cos(phi);
        const y = r * Math.sin(theta) * Math.cos(phi) * 0.75;
        const z = r * Math.sin(phi) * 0.65;

        pos[i3] = x;
        pos[i3 + 1] = y;
        pos[i3 + 2] = z;

        // Individual vorteks aylanish parametrlari
        vortexRadii[idx] = Math.sqrt(x * x + y * y);
        vortexAngles[idx] = Math.atan2(y, x);
        vortexSpeeds[idx] = (1.8 + Math.random() * 0.6); // Markaz juda tez aylanadi
        vortexHeights[idx] = z;

        // Rang: markaz oq-oltin nurdan elektr ko'k-fuxsiyaga
        const distRatio = r / 55;
        if (distRatio < 0.35) {
          col[i3] = 1.0; col[i3 + 1] = 0.98; col[i3 + 2] = 0.95; // Yorqin oq markaz
        } else if (distRatio < 0.7) {
          col[i3] = 1.0; col[i3 + 1] = 0.85; col[i3 + 2] = 0.35; // Oltin jilo
        } else {
          col[i3] = 0.3; col[i3 + 1] = 0.85; col[i3 + 2] = 1.0;  // Elektr moviy plazma
        }
      }

      // 2. KOSMIK QUTBIY OQIMLAR (Relativistic Polar Jets) - 3,500 zarracha
      // Markazdan yuqoriga (+Z) va pastga (-Z) otilib chiquvchi yorqin nurlar konusi
      const jetCount = 3500;
      for (let i = 0; i < jetCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const dir = (Math.random() < 0.5 ? 1 : -1);
        const h = Math.pow(Math.random(), 1.4) * 220; // Jet balandligi
        const spreadR = (h * 0.22) * Math.sqrt(Math.random());
        const jetAngle = Math.random() * Math.PI * 2;

        const x = Math.cos(jetAngle) * spreadR;
        const y = Math.sin(jetAngle) * spreadR * 0.8;
        const z = dir * (h + 10);

        pos[i3] = x;
        pos[i3 + 1] = y;
        pos[i3 + 2] = z;

        vortexRadii[idx] = Math.sqrt(x * x + y * y);
        vortexAngles[idx] = jetAngle;
        vortexSpeeds[idx] = 1.2;
        vortexHeights[idx] = z;

        // Elektr neon moviy va oq nur
        col[i3] = 0.4 + Math.random() * 0.6;
        col[i3 + 1] = 0.8 + Math.random() * 0.2;
        col[i3 + 2] = 1.0;
      }

      // 3. 3D QALIN SPIRAL TARMOQLAR (Dense Logarithmic Spiral Arms) - 18,000 zarracha
      // Ingichka chiziq emas! Haqiqiy galaktika gaz va yulduz bulutlari (nebula dust)
      const armParticles = 18000;
      const numArms = 2; // 2 ta dominant yirik spiral qo'l (Sombrero/Andromeda kabi)
      const maxGalaxyR = 430;

      for (let i = 0; i < armParticles && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const armIdx = i % numArms;
        const armBaseAngle = (armIdx * Math.PI * 2) / numArms;

        // Logarifmik spiral radiusi
        const p = Math.pow(Math.random(), 1.35);
        const r = 40 + p * (maxGalaxyR - 40);

        // Spiral burilish burchagi (markazdan qirragacha silliq o'raladi)
        const spiralAngle = Math.log(r / 35) * 2.8 + armBaseAngle;

        // Kenglik tarqalishi: markazdan uzoqlashgan sari spiral kengayadi (Astrophysical Arm Width)
        const armWidth = 22 + (r * 0.16);
        const normalOffset = (Math.random() - 0.5 + (Math.random() - 0.5)) * armWidth; // Gaussian-like spread

        const tangentAngle = spiralAngle + Math.PI * 0.5;
        let x = Math.cos(spiralAngle) * r + Math.cos(tangentAngle) * normalOffset;
        let y = Math.sin(spiralAngle) * r + Math.sin(tangentAngle) * normalOffset;

        // 3D qalinlik va egri disk effekti (Galactic Vertical Thickness & Warp)
        const diskThickness = (15 + (r * 0.08)) * (Math.random() - 0.5);
        // Voronka chuqurligi: markaz chuqur girdob bo'lib tortiladi
        const funnelZ = -Math.cos((r / maxGalaxyR) * Math.PI * 0.5) * 55 + diskThickness;

        pos[i3] = x;
        pos[i3 + 1] = y * 0.78; // Yengil 3D istiqbol
        pos[i3 + 2] = funnelZ;

        vortexRadii[idx] = r;
        vortexAngles[idx] = Math.atan2(y, x);
        // Keplerian tezlik: markazga yaqin zarrachalar tez, chetdagilar sekin aylanadi
        vortexSpeeds[idx] = Math.max(0.25, 1.4 / Math.sqrt(r * 0.035));
        vortexHeights[idx] = funnelZ;

        // Rang gradiyenti:
        // Ichki spiral: neon qizil va elektr fuxsiya
        // O'rta spiral: neon pushti va kosmik binafsha
        // Tashqi qirralar: moviy yulduz changlari va yaltiroq feruza
        if (r < 140) {
          col[i3] = 1.0;
          col[i3 + 1] = 0.05 + Math.random() * 0.15;
          col[i3 + 2] = 0.45 + Math.random() * 0.35; // Neon qizil-fuxsiya
        } else if (r < 270) {
          col[i3] = 0.95;
          col[i3 + 1] = 0.12 + Math.random() * 0.2;
          col[i3 + 2] = 0.85 + Math.random() * 0.15; // Elektr pushti-binafsha
        } else {
          col[i3] = 0.35 + Math.random() * 0.3;
          col[i3 + 1] = 0.15 + Math.random() * 0.3;
          col[i3 + 2] = 0.95 + Math.random() * 0.05; // Chuqur kosmik binafsha-moviy
        }
      }

      // 4. GALAKTIK HALO VA TASHQI KOSMIK YULDUZ CHANGLARI (Qolgan 7,000 zarracha)
      while (idx < N) {
        const i3 = idx * 3;
        const a = Math.random() * Math.PI * 2;
        const r = 180 + Math.random() * 320;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * (r * 0.75);
        const z = (Math.random() - 0.5) * 120;

        pos[i3] = x;
        pos[i3 + 1] = y;
        pos[i3 + 2] = z;

        vortexRadii[idx] = r;
        vortexAngles[idx] = a;
        vortexSpeeds[idx] = 0.35;
        vortexHeights[idx] = z;

        // Mayin binafsha va zumrad-moviy uchqunlar
        const rChoice = Math.random();
        if (rChoice < 0.6) {
          col[i3] = 0.7; col[i3 + 1] = 0.15; col[i3 + 2] = 0.95;
        } else {
          col[i3] = 0.1; col[i3 + 1] = 0.85; col[i3 + 2] = 0.9;
        }

        idx++;
      }

      return { positions: pos, colors: col };
    }

    /**
     * ========================================================
     * 3-BOSQICH: "Josiya" NEON ISMI
     * ========================================================
     */
    function createNameStage() {
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);

      const namePoints = getCanvasPoints(CONFIG.recipientName, 105, 800, 220);
      const namePartCount = Math.floor(N * 0.78);
      let idx = 0;

      for (let i = 0; i < namePartCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const p = namePoints[i % namePoints.length];

        pos[i3] = p.x + (Math.random() - 0.5) * 2;
        pos[i3 + 1] = p.y + (Math.random() - 0.5) * 2;
        pos[i3 + 2] = (Math.random() - 0.5) * 12;

        const isCore = Math.random() < 0.5;
        col[i3] = 1.0;
        col[i3 + 1] = isCore ? 0.95 : 0.15;
        col[i3 + 2] = isCore ? 0.95 : 0.5;
      }

      while (idx < N) {
        const i3 = idx * 3;
        const a = Math.random() * Math.PI * 2;
        const rad = 240 + Math.random() * 150;

        pos[i3] = Math.cos(a) * rad;
        pos[i3 + 1] = Math.sin(a) * (rad * 0.45);
        pos[i3 + 2] = (Math.random() - 0.5) * 80;

        col[i3] = 0.88; col[i3 + 1] = 0.12; col[i3 + 2] = 0.62;
        idx++;
      }

      return { positions: pos, colors: col };
    }

    /**
     * ========================================================
     * 4-BOSQICH: MUKAMMAL 3D ATIRGUL (HYPER-REALISTIC ROSE)
     * ========================================================
     */
    function createHyperRealisticRoseStage() {
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      let idx = 0;

      const roseCenterY = 55;

      // 1. G'uncha yadrosi (Tight Spiral Core)
      const budCount = 4000;
      for (let i = 0; i < budCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const t = Math.random();
        const theta = t * Math.PI * 18;
        const r = (3 + t * 22) * Math.sqrt(Math.random() * 0.75 + 0.25);
        const y = roseCenterY - 10 + t * 40;

        pos[i3] = Math.cos(theta) * r + (Math.random() - 0.5) * 1.2;
        pos[i3 + 1] = y + (Math.random() - 0.5) * 1.2;
        pos[i3 + 2] = Math.sin(theta) * r + (Math.random() - 0.5) * 1.2;

        col[i3] = 0.65 + t * 0.35;
        col[i3 + 1] = 0.01 + t * 0.05;
        col[i3 + 2] = 0.08 + t * 0.15;
      }

      // 2. Qatlam-qatlam Gulbarglar (Curved Layered Petals with Rim Glow)
      const petalLayers = [
        { count: 3, radius: 46,  height: 48, openAngle: 0.35, yOffset: 10 },
        { count: 5, radius: 76,  height: 42, openAngle: 0.65, yOffset: 4  },
        { count: 6, radius: 110, height: 35, openAngle: 0.95, yOffset: -4 },
        { count: 7, radius: 145, height: 26, openAngle: 1.25, yOffset: -12 }
      ];

      const petalsParticles = 15000;
      for (let i = 0; i < petalsParticles && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const layer = petalLayers[i % petalLayers.length];
        const petalIdx = Math.floor(Math.random() * layer.count);
        const baseAngle = (petalIdx * Math.PI * 2) / layer.count + (layer.count % 2 === 0 ? 0.3 : 0);

        const isRim = Math.random() < 0.38;
        let u, v;

        if (isRim) {
          u = (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 0.2);
          v = 0.2 + Math.random() * 0.8;
        } else {
          u = (Math.random() - 0.5) * 1.8;
          v = Math.random();
        }

        const widthShape = Math.sin(v * Math.PI) * (1 - 0.25 * Math.abs(u));
        const theta = baseAngle + (u * 0.65 * widthShape * (Math.PI / layer.count) * 2.2);

        const r = v * layer.radius * (0.8 + 0.2 * widthShape);
        const curl = Math.pow(v, 2.2) * (layer.openAngle * 35);
        const y = roseCenterY + layer.yOffset + (v * layer.height) - curl;

        let px = Math.cos(theta) * r;
        let py = y;
        let pz = Math.sin(theta) * r;

        px += (Math.random() - 0.5) * 1.8;
        py += (Math.random() - 0.5) * 1.8;
        pz += (Math.random() - 0.5) * 1.8;

        pos[i3] = px;
        pos[i3 + 1] = py;
        pos[i3 + 2] = pz;

        if (isRim || v > 0.88) {
          col[i3] = 1.0;
          col[i3 + 1] = 0.45 + 0.55 * (v > 0.9 ? 1 : 0);
          col[i3 + 2] = 0.65 + 0.35 * (v > 0.9 ? 1 : 0);
        } else {
          col[i3] = 0.85 + v * 0.15;
          col[i3 + 1] = 0.02 + v * 0.1;
          col[i3 + 2] = 0.12 + v * 0.25;
        }
      }

      // 3. Kosachabarglar (Sepals)
      const sepalsCount = 2600;
      for (let i = 0; i < sepalsCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const sepalIdx = Math.floor(Math.random() * 5);
        const angle = (sepalIdx * Math.PI * 2) / 5 + (Math.random() - 0.5) * 0.18;

        const t = Math.random();
        const r = t * 90;
        const y = roseCenterY - 14 - Math.pow(t, 1.8) * 32;

        pos[i3] = Math.cos(angle) * r + (Math.random() - 0.5) * 2;
        pos[i3 + 1] = y + (Math.random() - 0.5) * 2;
        pos[i3 + 2] = Math.sin(angle) * r + (Math.random() - 0.5) * 2;

        col[i3] = 0.02 + t * 0.1;
        col[i3 + 1] = 0.75 + t * 0.25;
        col[i3 + 2] = 0.35 + t * 0.2;
      }

      // 4. Gul Poyasi va 2 ta Yashil Barg
      const stemLeavesCount = 4000;
      for (let i = 0; i < stemLeavesCount && idx < N; i++, idx++) {
        const i3 = idx * 3;
        const isLeaf = Math.random() < 0.55;

        if (!isLeaf) {
          const t = Math.random();
          const y = (roseCenterY - 18) - t * 115;
          const curveX = Math.sin(t * Math.PI) * 10;
          const curveZ = Math.cos(t * Math.PI) * 6;
          const th = Math.random() * Math.PI * 2;
          const rad = Math.random() * 3.5;

          pos[i3] = curveX + Math.cos(th) * rad;
          pos[i3 + 1] = y;
          pos[i3 + 2] = curveZ + Math.sin(th) * rad;

          col[i3] = 0.05; col[i3 + 1] = 0.7; col[i3 + 2] = 0.3;
        } else {
          const side = Math.random() < 0.5 ? 1 : -1;
          const u = Math.random();
          const width = Math.sin(u * Math.PI) * 22 * (Math.random() * 0.8 + 0.2);
          const originY = roseCenterY - 60 + side * 15;

          const lx = side * (18 + u * 55) + (Math.random() - 0.5) * 2;
          const ly = originY - u * 15 + (Math.random() - 0.5) * width;
          const lz = side * 12 + (Math.random() - 0.5) * width;

          pos[i3] = lx; pos[i3 + 1] = ly; pos[i3 + 2] = lz;

          col[i3] = 0.08; col[i3 + 1] = 0.85; col[i3 + 2] = 0.4;
        }
      }

      // 5. Ostidagi "Josiya" Ismi va Nozik Qizil Yurakcha
      const namePoints = getCanvasPoints(CONFIG.recipientName, 65, 700, 140);
      const nameBaseY = -120;

      while (idx < N) {
        const i3 = idx * 3;
        const pick = Math.random();

        if (pick < 0.82) {
          const p = namePoints[idx % namePoints.length];
          pos[i3] = p.x + (Math.random() - 0.5) * 2;
          pos[i3 + 1] = p.y + nameBaseY + (Math.random() - 0.5) * 2;
          pos[i3 + 2] = (Math.random() - 0.5) * 10;

          const isW = Math.random() < 0.6;
          col[i3] = 1.0;
          col[i3 + 1] = isW ? 0.95 : 0.2;
          col[i3 + 2] = isW ? 0.95 : 0.5;
        } else {
          const t = Math.random() * Math.PI * 2;
          const s = 1.15 * Math.sqrt(Math.random());
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

          pos[i3] = hx * s;
          pos[i3 + 1] = hy * s + nameBaseY - 38;
          pos[i3 + 2] = (Math.random() - 0.5) * 8;

          col[i3] = 1.0; col[i3 + 1] = 0.05; col[i3 + 2] = 0.2;
        }
        idx++;
      }

      return { positions: pos, colors: col };
    }

    /**
     * MATNDAN PIKSEL KOORDINATALARINI OLISH
     */
    function getCanvasPoints(text, size, maxW, maxH) {
      const c = document.createElement("canvas");
      c.width = maxW;
      c.height = maxH;
      const ctx = c.getContext("2d");

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, maxW, maxH);

      ctx.fillStyle = "#fff";
      ctx.font = `bold ${size}px 'Cinzel', 'Playfair Display', serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, maxW / 2, maxH / 2);

      const img = ctx.getImageData(0, 0, maxW, maxH).data;
      const pts = [];
      const step = 2;

      for (let y = 0; y < maxH; y += step) {
        for (let x = 0; x < maxW; x += step) {
          if (img[(y * maxW + x) * 4] > 100) {
            pts.push({ x: x - maxW / 2, y: -(y - maxH / 2) });
          }
        }
      }
      return pts.length > 0 ? pts : [{ x: 0, y: 0 }];
    }

    /**
     * ========================================================
     * BOSQICHLAR VA TRANZITSIYA DINAMIKASI
     * ========================================================
     */
    const stages = [
      createEnvelopeStage(),
      createVortexStage(),
      createNameStage(),
      createHyperRealisticRoseStage()
    ];

    let currentStage = 0;
    let isTransitioning = false;
    let sequenceTimer = null;

    for (let i = 0; i < N * 3; i++) {
      currentPos[i] = stages[0].positions[i];
      sourcePos[i] = stages[0].positions[i];
      targetPos[i] = stages[0].positions[i];

      currentCol[i] = stages[0].colors[i];
      sourceCol[i] = stages[0].colors[i];
      targetCol[i] = stages[0].colors[i];
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;

    let transitionTween = null;
    const animState = { progress: 0 };

    function transitionTo(nextStageIdx, duration = 3000) {
      if (nextStageIdx < 0 || nextStageIdx >= stages.length) return;
      currentStage = nextStageIdx;

      for (let i = 0; i < N * 3; i++) {
        sourcePos[i] = currentPos[i];
        targetPos[i] = stages[nextStageIdx].positions[i];

        sourceCol[i] = currentCol[i];
        targetCol[i] = stages[nextStageIdx].colors[i];
      }

      for (let i = 0; i < N; i++) {
        const i3 = i * 3;
        const angle = Math.random() * Math.PI * 2;
        const force = 35 + Math.random() * 120;

        velocities[i3] = Math.cos(angle) * force;
        velocities[i3 + 1] = Math.sin(angle) * force;
        velocities[i3 + 2] = (Math.random() - 0.5) * force;
      }

      if (transitionTween) transitionTween.stop();
      animState.progress = 0;
      isTransitioning = true;

      transitionTween = new TWEEN.Tween(animState)
        .to({ progress: 1 }, duration)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onUpdate(() => {
          const p = animState.progress;
          const burstFactor = Math.sin(p * Math.PI);

          for (let i = 0; i < N; i++) {
            const i3 = i * 3;
            const d = delays[i];
            let localP = (p - d) / (1 - d);
            localP = Math.max(0, Math.min(1, localP));
            const smoothP = localP * localP * (3 - 2 * localP);

            const bX = velocities[i3] * burstFactor * 0.22;
            const bY = velocities[i3 + 1] * burstFactor * 0.22;
            const bZ = velocities[i3 + 2] * burstFactor * 0.22;

            currentPos[i3] = sourcePos[i3] + (targetPos[i3] - sourcePos[i3]) * smoothP + bX;
            currentPos[i3 + 1] = sourcePos[i3 + 1] + (targetPos[i3 + 1] - sourcePos[i3 + 1]) * smoothP + bY;
            currentPos[i3 + 2] = sourcePos[i3 + 2] + (targetPos[i3 + 2] - sourcePos[i3 + 2]) * smoothP + bZ;

            currentCol[i3] = sourceCol[i3] + (targetCol[i3] - sourceCol[i3]) * smoothP;
            currentCol[i3 + 1] = sourceCol[i3 + 1] + (targetCol[i3 + 1] - sourceCol[i3 + 1]) * smoothP;
            currentCol[i3 + 2] = sourceCol[i3 + 2] + (targetCol[i3 + 2] - sourceCol[i3 + 2]) * smoothP;
          }
          geometry.attributes.position.needsUpdate = true;
          geometry.attributes.color.needsUpdate = true;
        })
        .onComplete(() => {
          isTransitioning = false;
          if (nextStageIdx === 3) {
            document.getElementById("replay-box").classList.add("active");
          }
        })
        .start();
    }

    /**
     * SSENARIY BOSHLANISHI
     */
    function startExperience() {
      document.getElementById("action-wrapper").classList.add("hidden");
      document.getElementById("replay-box").classList.remove("active");

      startSound();

      // 1 ➔ 2 (Vorteks)
      transitionTo(1, 2800);

      if (sequenceTimer) clearTimeout(sequenceTimer);
      // 2 ➔ 3 (Ism) - Vorteks rohat bilan ko'rinishi uchun 4.2 soniya beramiz
      sequenceTimer = setTimeout(() => {
        transitionTo(2, 3000);

        // 3 ➔ 4 (Atirgul)
        sequenceTimer = setTimeout(() => {
          transitionTo(3, 3400);
        }, 4400);

      }, 4200);
    }

    /**
     * ========================================================
     * WEB AUDIO AMBIENT
     * ========================================================
     */
    let audioCtx = null;
    let isMuted = false;
    let synthRunning = false;
    const bgAudioEl = document.getElementById("bg-audio");

    function initAudio() {
      if (audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        return;
      }
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
    }

    const chords = [
      [261.63, 329.63, 392.00, 523.25],
      [220.00, 261.63, 329.63, 440.00],
      [174.61, 220.00, 261.63, 349.23],
      [196.00, 246.94, 293.66, 392.00]
    ];
    let chIdx = 0, noteIdx = 0;

    function playArpeggio() {
      if (!audioCtx || isMuted || synthRunning) return;
      synthRunning = true;

      setInterval(() => {
        if (isMuted || !audioCtx) return;
        if (audioCtx.state === "suspended") audioCtx.resume();

        const chord = chords[chIdx];
        const freq = chord[noteIdx % chord.length];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.9);

        noteIdx++;
        if (noteIdx % 4 === 0) chIdx = (chIdx + 1) % chords.length;
      }, 430);
    }

    function startSound() {
      initAudio();
      if (CONFIG.audioUrl) {
        bgAudioEl.src = CONFIG.audioUrl;
        bgAudioEl.play().catch(() => playArpeggio());
      } else {
        playArpeggio();
      }
    }

    document.getElementById("mute-btn").addEventListener("click", () => {
      isMuted = !isMuted;
      const btn = document.getElementById("mute-btn");
      if (isMuted) {
        btn.style.opacity = "0.35";
        bgAudioEl.pause();
      } else {
        btn.style.opacity = "1";
        startSound();
      }
    });

    /**
     * ========================================================
     * ASOSIY RENDER VA REALISTIK GIGANT VORTEKS DINAMIKASI
     * ========================================================
     */
    const clock = new THREE.Clock();

    function render() {
      requestAnimationFrame(render);
      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();
      TWEEN.update();

      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      camera.position.x = mouse.x;
      camera.position.y = -mouse.y;
      camera.lookAt(0, 0, 0);

      if (starsPoints) {
        starsPoints.rotation.y = elapsed * 0.016;
        starsPoints.rotation.x = elapsed * 0.008;
      }

      if (!isTransitioning) {
        if (currentStage === 1) {
          // 2-BOSQICH: HAQIQIY DIFFERENSIAL KEPLERIAN VORTEKS HARAKATI!
          // Markaziy zarrachalar shiddat bilan aylanadi, spiral esa silliq o'raladi
          const pulse = 1.0 + Math.sin(elapsed * 3.5) * 0.04;
          
          for (let i = 0; i < N; i++) {
            const i3 = i * 3;
            // Burchakni har bir zarrachaning o'z tezligiga qarab aylantiramiz
            const speed = vortexSpeeds[i] * 0.018;
            vortexAngles[i] += speed;

            const r = vortexRadii[i] * pulse;
            const a = vortexAngles[i];
            const baseH = vortexHeights[i];

            // To'lqinsimon kosmik tebranish (Warp wave)
            const waveZ = Math.sin(a * 2 + elapsed * 2.5) * (r * 0.04);

            currentPos[i3] = Math.cos(a) * r;
            currentPos[i3 + 1] = Math.sin(a) * r * 0.78;
            currentPos[i3 + 2] = baseH + waveZ;
          }
          geometry.attributes.position.needsUpdate = true;

          // Butun galaktika diski sekin 3D burchakda suzib turadi
          particleSystem.rotation.z = elapsed * 0.08;
          particleSystem.rotation.x = 0.35 + Math.sin(elapsed * 0.6) * 0.08;
          particleSystem.rotation.y = Math.cos(elapsed * 0.5) * 0.12;
          particleSystem.scale.set(1, 1, 1);

        } else if (currentStage === 3) {
          // 4-BOSQICH: ATIRGUL NAFAS OLISHI
          const breath = 1.0 + Math.sin(elapsed * 2.2) * 0.038;
          particleSystem.scale.set(breath, breath, breath);

          particleSystem.rotation.y = Math.sin(elapsed * 0.6) * 0.16;
          particleSystem.rotation.x = Math.cos(elapsed * 0.7) * 0.08;
          particleSystem.rotation.z = Math.sin(elapsed * 0.4) * 0.03;
        } else {
          particleSystem.scale.set(1, 1, 1);
          particleSystem.rotation.y = Math.sin(elapsed * 0.5) * 0.06;
          particleSystem.rotation.x = Math.cos(elapsed * 0.4) * 0.04;
          particleSystem.rotation.z = 0;
        }
      } else {
        particleSystem.rotation.z *= 0.94;
        particleSystem.rotation.x *= 0.94;
      }

      renderer.render(scene, camera);
    }
    render();

    /**
     * HODISALAR
     */
    const openBtn = document.getElementById("open-btn");
    openBtn.addEventListener("click", startExperience);

    document.getElementById("replay-btn").addEventListener("click", () => {
      document.getElementById("replay-box").classList.remove("active");
      document.getElementById("action-wrapper").classList.remove("hidden");
      if (sequenceTimer) clearTimeout(sequenceTimer);
      transitionTo(0, 2000);
    });

  </script>
</body>
</html>
